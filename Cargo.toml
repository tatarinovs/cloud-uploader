[package]
name = "cloud-uploader"
version = "1.0.0"
edition = "2021"
authors = ["Cloud Uploader Team"]
description = "Universal cloud backup and release mirror utility"

[dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
walkdir = "2.5"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
regex = "1.10"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
